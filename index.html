<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Трекер пробежек</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>Трекер пробежек</h1>
    <p class="subtitle">Веди учёт пробежек и следи за недельным километражем</p>
  </header>

  <section class="stats">
    <div class="stat-card">
      <span class="stat-label">За эту неделю</span>
      <span class="stat-value" id="weekDistance">0.0 км</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Всего пробежек</span>
      <span class="stat-value" id="totalRuns">0</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Всего километров</span>
      <span class="stat-value" id="totalDistance">0.0 км</span>
    </div>
  </section>

  <section class="form-section">
    <form id="runForm" novalidate>
      <div class="field">
        <label for="date">Дата</label>
        <input type="date" id="date" name="date" required>
      </div>
      <div class="field">
        <label for="distance">Дистанция, км</label>
        <input type="number" id="distance" name="distance" step="0.01" min="0.01" placeholder="5.0" required>
      </div>
      <div class="field">
        <label for="time">Время (чч:мм:сс)</label>
        <input type="text" id="time" name="time" placeholder="00:25:30" pattern="^([0-9]{1,2}:)?[0-9]{1,2}:[0-9]{2}$" required>
      </div>
      <button type="submit" class="btn-primary">Добавить пробежку</button>
    </form>
    <p class="form-error" id="formError" hidden></p>
  </section>

  <section class="list-section">
    <h2>История пробежек</h2>
    <ul class="run-list" id="runList"></ul>
    <p class="empty-state" id="emptyState">Пока нет ни одной записи. Добавь первую пробежку!</p>
  </section>
</div>

<script src="app.js" defer></script>
</body>
</html>
